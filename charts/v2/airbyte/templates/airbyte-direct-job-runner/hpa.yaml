{{- if and .Values.directJobRunner.enabled .Values.directJobRunner.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: {{ include "airbyte.directJobRunner.namespace" . }}
  name: {{ .Release.Name }}-direct-job-runner
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-direct-job-runner
  minReplicas: {{ .Values.directJobRunner.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.directJobRunner.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.directJobRunner.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
