{{- if and .Values.directJobRunner.enabled (not .Values.directJobRunner.serviceAccountName) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ include "airbyte.directJobRunner.namespace" . }}
  name: {{ include "airbyte.directJobRunner.serviceAccountName" . }}
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
